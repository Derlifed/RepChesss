<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RepChess: Chess Opening Trainer</title><meta name="description" content="Chess opening trainer. Practice your repertoire move by move, one variation at a time."><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f6f2;--bg2:#eeece6;--card:#fff;--fg:#1b1d1f;--mut:#5f666d;--bd:#dcdad2;--acc:#1f6f4a;--okc:#17563a;--bad:#b3261e;--l:#ebecd0;--d:#779556}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--bg2:#23272b;--card:#1a1d20;--fg:#ecebe6;--mut:#9aa0a6;--bd:#2b2f33;--acc:#2a7d56;--okc:#6ccf9f;--bad:#f2766d;--l:#d4d6bd;--d:#657f4c}}
:root[data-theme="dark"]{--bg:#121416;--bg2:#23272b;--card:#1a1d20;--fg:#ecebe6;--mut:#9aa0a6;--bd:#2b2f33;--acc:#2a7d56;--okc:#6ccf9f;--bad:#f2766d;--l:#d4d6bd;--d:#657f4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:auto;padding:0 18px 48px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px}
.logo svg{width:36px;height:36px;padding:5px;border-radius:8px;background:var(--acc)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;font-weight:700;margin:28px 0 8px}
.sub{color:var(--mut);max-width:600px;margin:0 0 20px}
h2{margin:28px 0 12px;font-size:20px;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 16px 10px 12px}
.chip b{display:block;font-size:20px;line-height:1.1}.chip small{color:var(--mut)}
.ico{width:26px;height:26px;flex:none}.fl{fill:#e0702b}.bo,.st{fill:#d9a400}.ck{fill:#2f8f5b}.hr{fill:#c9372c;width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--acc);border-radius:12px;padding:18px}
.card h3{margin:0 0 4px;font-size:18px}.card p{margin:12px 0;color:var(--mut)}
.top{display:flex;gap:14px;align-items:center}
.tile{width:54px;height:54px;flex:none;border-radius:10px;padding:7px;background:var(--bg2)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--bg2);color:var(--mut)}.pill b{color:var(--fg)}
.meta{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button,select{font:inherit;font-weight:600;border:1px solid var(--bd);border-radius:8px;padding:9px 14px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{background:var(--bg2)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:var(--acc);filter:brightness(1.12)}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tgl{padding:6px 12px}
.q{font:inherit;width:100%;max-width:420px;margin:22px 0 0;padding:10px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}.q:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.card[hidden]{display:none}
.pos{display:block;color:var(--mut)}
.crumb{display:flex;align-items:center;gap:10px;margin-top:14px}
.ttl{display:flex;align-items:center;gap:12px;margin:14px 0}.ttl svg{width:40px;height:40px}
.play{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.boardw{padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
.board{--s:min(calc(100vw - 100px),540px);width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:4px;overflow:hidden}
.sq{position:relative;display:flex;min-width:0;min-height:0;cursor:pointer}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq::before{content:"";position:absolute;inset:0}
.sq.lm::before{background:rgba(235,200,40,.5)}.sq.sel::before{background:rgba(31,111,74,.5)}
.sq.hint::before{background:rgba(37,99,235,.5);animation:pulse 1s infinite}
.sq.chk::before{background:radial-gradient(circle,rgba(220,38,38,.95),rgba(220,38,38,0) 72%)}
.sq.tg::after{content:"";box-sizing:border-box;position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(15,23,42,.3);z-index:3}
.sq.tg.cap::after{width:92%;height:92%;background:none;border:5px solid rgba(15,23,42,.3)}
.co{position:absolute;font:700 calc(var(--s)/8*.2)/1 "Outfit",sans-serif;font-style:normal;pointer-events:none;z-index:1}.co.r{top:4%;left:5%}.co.f{bottom:4%;right:6%}
.l .co{color:var(--d)}.d .co{color:var(--l)}
.pc{width:100%;height:100%;display:block;stroke-linejoin:round;stroke-linecap:round;stroke-width:1.5;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35))}
.pc.w{fill:url(#gw);stroke:#2b3040;--eye:#2b3040}.pc.b{fill:url(#gb);stroke:#0a0d18;--eye:#e8e2d0}
.sq .pc{position:relative;z-index:2;pointer-events:none}
.panel{flex:1;min-width:260px;max-width:430px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.line{font-size:20px;font-weight:700}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hearts{display:flex;gap:3px}
.msg{margin:14px 0;padding:10px 12px;border-radius:8px;background:var(--bg2);border-left:4px solid var(--mut);font-weight:600;animation:pop .2s both}
.msg.ok{border-color:var(--acc);color:var(--okc)}.msg.no{border-color:var(--bad);color:var(--bad)}
.mv{margin-top:14px;line-height:2}.mv span{display:inline-block;padding:1px 8px;margin:2px;border-radius:5px;background:var(--bg2);color:var(--mut);font-weight:600}
.mv .on{background:var(--acc);color:#fff}
.foot{margin-top:28px;font-size:14px;color:var(--mut)}.foot a{color:inherit;cursor:pointer;text-decoration:underline}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
@keyframes pulse{50%{opacity:.5}}

.boardw{display:flex;gap:8px}.bcol{position:relative}
.tray{display:flex;align-items:center;height:30px;padding:0 2px;color:var(--mut);font-size:14px;gap:8px}
.tray .who{font-weight:600;min-width:44px}.cps{display:flex;align-items:center;padding-right:8px}
.cp{width:20px;height:20px;margin-right:-7px;filter:none}.adv{color:var(--fg);font-weight:700}
.eb{position:relative;width:22px;margin:30px 0;border-radius:4px;overflow:hidden;background:#2b2b2b;box-shadow:0 0 0 1px var(--bd)}
.eb i{position:absolute;left:0;right:0;background:#f2f2f2;transition:height .35s}
.eb em{position:absolute;left:0;right:0;text-align:center;font:700 10px/1 "Outfit",sans-serif;font-style:normal}
.ov{display:none;position:absolute;left:0;right:0;top:30px;bottom:30px;align-items:center;justify-content:center;text-align:center;background:rgba(15,15,15,.85);color:#fff;border-radius:4px;z-index:5}
.ov.on{display:flex}.ov h3{margin:0 0 6px;font-size:26px}.ov p{margin:0}
.why{margin:0 0 6px;min-height:3em}.keys{margin:12px 0 0;font-size:13px;color:var(--mut)}
.sec{margin:28px 0 12px;font-size:20px;font-weight:700}
.hb{display:flex;gap:8px;min-width:0}#ub{display:flex;align-items:center}#ub:empty{display:none}#acct{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);padding:22px;width:min(380px,calc(100vw - 32px))}
.dl::backdrop{background:rgba(0,0,0,.55)}.dl h3{margin:0 0 4px;font-size:22px}.dl p{margin:6px 0;color:var(--mut)}
.dl label{display:block;font-size:14px;font-weight:600;margin:14px 0 4px}
.dl input{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}.dl input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.dl .err{color:var(--bad);font-weight:600}.dl .ok{color:var(--okc);font-weight:600}.dl .btns button.pri{flex:1}
.lk{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font-weight:600;font-size:14px}.lk:hover{background:none}
.alt{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
</style></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cdd4e4"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6882"/><stop offset="1" stop-color="#1a2033"/></linearGradient>
<g id="Pp"><path d="M14.5 35C14.5 29.5 17 26 22.5 24.5 28 26 30.5 29.5 30.5 35Z"/><rect x="11" y="35" width="23" height="4.5" rx="2"/><ellipse cx="22.5" cy="23" rx="6" ry="2.4"/><circle cx="22.5" cy="14" r="5.5"/></g>
<g id="Pr"><path d="M14 22h17l1.5 13h-20z"/><path d="M11 22V11h5v4h4v-4h5v4h4v-4h5v11z"/><rect x="10" y="35" width="25" height="4.5" rx="2"/></g>

<g id="Pb"><path d="M22.5 7c-2 0-3.2 1.4-3.2 3 0 .8.3 1.4.8 2-3.6 2.4-6.1 6-6.1 10.6 0 3 1.3 5 2.6 6.4h11.8c1.3-1.4 2.6-3.4 2.6-6.4 0-4.6-2.5-8.2-6.1-10.6.5-.6.8-1.2.8-2 0-1.6-1.2-3-3.2-3z"/><path d="M13 36c3-.5 5.5-2.5 6.5-7h6c1 4.5 3.5 6.5 6.5 7v3.5H13z"/><path d="M21 16l5 5" style="fill:none;stroke:var(--eye);stroke-width:2"/><circle cx="22.5" cy="6" r="2.3"/></g>
<g id="Pq"><path d="M12 35 9.5 15 15.5 27 17 12.5 21 26.5 22.5 10 24 26.5 28 12.5 29.5 27 35.5 15 33 35Z"/><circle cx="9.5" cy="14.5" r="2"/><circle cx="17" cy="11.5" r="2"/><circle cx="22.5" cy="9" r="2"/><circle cx="28" cy="11.5" r="2"/><circle cx="35.5" cy="14.5" r="2"/><rect x="11" y="35" width="23" height="4.5" rx="2"/></g>
<g id="Pk"><path d="M22.5 13c-7.5 0-12.5 4.5-12.5 10.5 0 3.5 1.8 5.5 3.5 7L12 35h21l-1.5-4.5c1.7-1.5 3.5-3.5 3.5-7C35 17.5 30 13 22.5 13z"/><path d="M14 29h17" style="fill:none"/><path d="M21 3.5h3v3h3v3h-3v3h-3v-3h-3v-3h3z"/><rect x="10.5" y="35" width="24" height="4.5" rx="2"/></g>
<path id="Icheck" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>

</defs></svg><div class="wrap"><div class="hd"><div class="logo"><svg class="pc w" viewBox="0 0 45 45"><use href="#Pn"/></svg>RepChess</div><div class="hb"><div id="ub"></div><button id="acct" class="tgl" onclick="acct()" hidden>Log in</button><button id="su" class="tgl" onclick="acct('up')" hidden>Sign up</button><button class="tgl" onclick="tgl()">Theme</button></div></div><div id="app"></div></div><dialog id="dl" class="dl" aria-labelledby="dlt"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
<script>
let COURSES=[];
const BLACK=/Defen[cs]e|Countergambit|Indian(?! Attack)|Englund|Latvian|Benko|Elephant/;
const icOf=s=>/^[NBRQK]/.test(s)?s[0].toLowerCase():s[0]==='O'?'k':'p';
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmt=a=>a.map((x,j)=>(j%2?'':(j/2+1)+'.')+x).join(' ');
async function load(){
 const T=await Promise.all([...'abcde'].map(f=>fetch('openings-'+f+'.tsv').then(r=>{if(!r.ok)throw new Error(f+'.tsv '+r.status);return r.text()})));
 const F=new Map();
 T.forEach(t=>t.split('\n').slice(1).forEach(row=>{const[eco,full,pgn]=row.trim().split('\t');if(!pgn)return;
  const i=full.search(/[:,]/),fam=(i<0?full:full.slice(0,i)).trim(),v=i<0?'':full.slice(i+1).trim();
  if(!F.has(fam))F.set(fam,{name:fam,eco:[],rows:[]});const f=F.get(fam);f.eco.push(eco);
  const sans=pgn.split(/\s+/).filter(x=>x&&!/^\d+\.+$/.test(x));f.rows.push({name:v||'Main line',full,eco,idea:eco+' · '+full,sans,key:sans.join(' ')})}));
 COURSES=[...F.values()].map(f=>{const side=BLACK.test(f.name)?'b':'w',c={id:slug(f.name),name:f.name,side,root:{k:{},path:'',ply:0},lines:[]},all=f.rows;
  all.forEach((l,i)=>{if(all.some((o,j)=>j!==i&&(o.key===l.key?j<i:o.key.startsWith(l.key+' '))))return;
   let n=c.root;l.sans.forEach((s,k)=>{if(!n.k[s])n.k[s]={k:{},path:n.path+' '+s,ply:k+1};n=n.k[s]});c.lines.push(l)});
  all.forEach(l=>{let n=c.root;for(const s of l.sans){n=n.k[s];if(!n)return}n.nm=n.nm||l.full});
  let pre=all[0].sans;all.forEach(l=>{let k=0;while(k<pre.length&&pre[k]===l.sans[k])k++;pre=pre.slice(0,k)});
  const my=all.reduce((a,l)=>a.length<=l.sans.length?a:l.sans,all[0].sans).filter((x,j)=>(j%2===0)===(side==='w'));
  c.ic=icOf(my[0]||'p');const e=f.eco.sort(),er=e[0]===e[e.length-1]?e[0]:e[0]+'–'+e[e.length-1];
  c.desc=`${side==='w'?'White':'Black'} repertoire with ${all.length} named line${all.length===1?'':'s'} (ECO ${er})${pre.length?', starting '+fmt(pre):''}.`;return c})
  .filter(c=>c.lines.length).sort((a,b)=>b.lines.length-a.lines.length||a.name.localeCompare(b.name));
}
const INT=[0,1,2,4,8,16],DAY=864e5;
const $=s=>document.querySelector(s),P0=a=>a.map(x=>' '+x).join('');
let P=null;try{P=JSON.parse((localStorage.getItem('repchess1')||localStorage.getItem('repforge1')))}catch(e){}
P=P||{xp:0,streak:0,last:'',best:0,it:{},ln:{},rd:{}};
let ME=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const save=()=>{try{localStorage.setItem('repchess1',JSON.stringify(P))}catch(e){}if(window.sync)sync()};
const mine=(n,c)=>(n.ply%2===0)===(c.side==='w');
const itm=(c,n)=>P.it[c.id+n.path]||(P.it[c.id+n.path]={b:0,d:0});
const isDue=(c,n)=>{const i=P.it[c.id+n.path];return !i||i.d<=Date.now()};
P.rd=P.rd||{};P.ln=P.ln||{};
let S={};
function touch(){const d=new Date().toDateString(),y=new Date(Date.now()-DAY).toDateString();
 if(P.last!==d){P.streak=P.last===y?P.streak+1:1;P.last=d}save()}
function home(){clearInterval(S.t);S={view:'home'};
 const dn=c=>c.lines.filter(l=>P.ln[c.id+P0(l.sans)]).length,tot=COURSES.reduce((a,c)=>a+c.lines.length,0),all=COURSES.reduce((a,c)=>a+dn(c),0),
 ch=(i,k,v,l)=>`<div class="chip"><svg class="ico ${k}" viewBox="0 0 24 24"><use href="#I${i}"/></svg><div><b>${v}</b><small>${l}</small></div></div>`,
 card=c=>{const d=dn(c),n=c.lines.length,pc=Math.round(100*d/n);
 return `<div class="card" data-n="${c.name.toLowerCase()}"><div class="top"><div class="tile"><svg class="pc ${c.side}" viewBox="0 0 45 45"><use href="#P${c.ic}"/></svg></div><div><h3>${c.name}</h3><span class="pill">Play ${c.side==='w'?'White':'Black'}</span></div></div><p>${c.desc}</p><div class="meta"><small>${n} variation${n===1?'':'s'}</small><small><b>${d}</b> of ${n} completed</small></div><div class="bar"><i style="width:${pc}%"></i></div><div class="btns"><button class="pri" onclick="reps('${c.id}')">Reps</button><button onclick="learn('${c.id}')">Learn</button><button onclick="drill('${c.id}')">Drill</button></div></div>`},
 sec=(t,sd)=>{const l=COURSES.filter(c=>c.side===sd);return `<h2 class="sec">${t} (<span>${l.length}</span>)</h2><div class="grid">${l.map(card).join('')}</div>`};
 $('#app').innerHTML=`<h1>Drill chess openings move by move</h1><p class="sub">Choose one of ${COURSES.length} openings and play your side. The trainer plays the opponent's replies and goes through every variation in random order before repeating any.</p><div class="stats">${ch('flame','fl',P.streak,'day streak')}${ch('bolt','bo',P.xp,'total XP')}${ch('check','ck',all,'of '+tot+' variations completed')}${ch('star','st',P.best,'drill best')}</div><input id="q" class="q" type="search" placeholder="Search openings" aria-label="Search openings" oninput="flt(this.value)">${sec('Play as White','w')}${sec('Play as Black','b')}<p class="foot">A variation counts as completed when you play it through to the end. Reps go through every variation of a course in random order, then reshuffle. ${ME?`Progress is saved to your account (${esc(ME)}).`:window.acct?'Progress is saved in this browser. <a onclick="acct()">Log in</a> to save it to your account and keep it on any device.':'Progress is saved in this browser.'} <a id="rs" onclick="reset()">Reset progress</a></p><p class="foot"><a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms and conditions</a></p>`}
function flt(v){v=v.trim().toLowerCase();document.querySelectorAll('.grid').forEach(g=>{let n=0;g.querySelectorAll('.card').forEach(c=>{const on=c.dataset.n.includes(v);c.hidden=!on;n+=on});g.previousElementSibling.querySelector('span').textContent=n})}
function reset(){if(!S.rc){S.rc=1;$('#rs').textContent='Click again to confirm reset';return}P={xp:0,streak:0,last:'',best:0,it:{},ln:{},rd:{}};save();home()}
function shell(c,title){S.c=c;clearInterval(S.t);
 $('#app').innerHTML=`<div class="crumb"><button onclick="home()">Back to courses</button><span class="pill">${title}</span></div><h2 class="ttl"><svg class="pc ${c.side}" viewBox="0 0 45 45"><use href="#P${c.ic}"/></svg>${c.name}</h2><div class="play"><div class="boardw"><div id="eb" class="eb" title="Estimate from material and piece placement. Not an engine."></div><div class="bcol"><div id="ct" class="tray"></div><div id="board" class="board"></div><div id="cb" class="tray"></div><div id="ov" class="ov"></div></div></div><div class="panel"><div id="info"></div><div id="msg" class="msg"></div><div id="why" class="why"></div><div id="ctl" class="btns"></div><p id="keys" class="keys"></p><div id="mv" class="mv"></div></div></div>`}
function msg(t,k){const e=$('#msg');e.className='msg '+(k||'');e.textContent=t;e.style.animation='none';e.offsetWidth;e.style.animation=''}
function draw(){const g=S.g,fl=S.c.side==='b',B=$('#board'),t=S.sel?g.moves({square:S.sel,verbose:true}).map(m=>m.to):[],ck=g.in_check();let h='';
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){const fi=fl?7-f:f,ra=fl?r:7-r,sq='abcdefgh'[fi]+(ra+1),p=g.get(sq),c=['sq',(fi+ra)%2?'l':'d'];
  if(S.last&&(S.last.from===sq||S.last.to===sq))c.push('lm');if(S.sel===sq)c.push('sel');if(S.hint&&S.hint.includes(sq))c.push('hint');

  if(el)el.animate([{transform:`translate(${pa.left-pb.left}px,${pa.top-pb.top}px)`,zIndex:9},{transform:'none',zIndex:9}],{duration:260,easing:'cubic-bezier(.25,.9,.3,1)'});S.anim=null}}

const expMove=()=>{const k=Object.keys(S.node.k),t=S.line.sans[S.node.ply],s=thru(S.line,S.node)&&S.node.k[t]?t:k[0];return S.g.moves({verbose:true}).find(m=>m.san===s)};
function move(from,to){const g=S.g,m=g.move({from,to,promotion:'q'});if(!m)return;

   return after(()=>{const mv=g.move(e);S.last=mv;S.anim=[mv.from,mv.to];S.node=n.k[mv.san];draw();if(!Object.keys(S.node.k).length)return done();after(opp,450)},700)}

function opp(){const n=S.node,ks=Object.keys(n.k),ls=S.line.sans[n.ply];

 $('#ov').innerHTML=`<div><h3>${t}</h3><p>Score <b>${S.score}</b>${w?' (new best)':' · Best '+P.best}</p></div>`;$('#ov').classList.add('on');

function learn(id){const c=COURSES.find(x=>x.id===id);S={mode:'learn',i:0,li:0,gen:0};shell(c,'Learn');

const NM={p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'},PV={p:1,n:3,b:3,r:5,q:9},CP={p:100,n:320,b:330,r:500,q:900},ST={p:8,n:2,b:2,r:2,q:1},FL='abcdefgh';
function att(g,sq){const p=g.get(sq),f=FL.indexOf(sq[0]),r=+sq[1],o=[];if(!p)return o;const add=(x,y)=>{if(x>=0&&x<8&&y>=1&&y<=8)o.push(FL[x]+y)};

 if(m.captured)o.push((pv&&pv.captured&&pv.to===to?'Recaptures the ':'Captures the ')+NM[m.captured]+' on '+to+'.');

async function go(m,f){const b=f.querySelector('.pri'),r=$('#ar'),n=f.querySelector('#an')?.value.trim().toLowerCase(),say=(t,k)=>{r.textContent=t;r.className=k||''};
 b.disabled=true;say('');try{

  const js=(src,attrs={})=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';Object.entries(attrs).forEach(([k,v])=>s.setAttribute(k,v));s.onload=ok;s.onerror=()=>no(new Error('Could not load '+src));document.head.appendChild(s)});
  // Loads Clerk's browser instance from its CDN. The CDN creates window.Clerk; it is not a constructor.
  (async()=>{try{

    const encodedHost=j.publishableKey.split('_')[2];
